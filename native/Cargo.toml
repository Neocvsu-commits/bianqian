[package]
name = "bianqian"
version = "0.31.0"
edition = "2021"
description = "桌面纸张便签"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }
tauri-codegen = { version = "=2.5.5", default-features = false }
tauri-utils = { version = "=2.8.3", default-features = false }

[dependencies]
tauri = { version = "=2.10.3", features = [] }
# Keep the compatible Tauri family together; newer runtime minor versions change
# the callback types used internally by this version of the public API.
tauri-macros = { version = "=2.5.5", default-features = false }
tauri-runtime = { version = "=2.10.1", default-features = false }
tauri-runtime-wry = { version = "=2.10.1", default-features = false }
tauri-utils = { version = "=2.8.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
